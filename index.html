<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
    <title>Rs Live Tv - The Unlimited Entertainment Here</title>
    <meta name="description" content="Rs Live Tv - Watch Live TV, Movies, Cricket, Shorts and more." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://i.postimg.cc/mD1VCt2C/RS-Live.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        :root { --primary-red:#e74c3c; --bg-dark:#0d0d0d; --bg-card:#1a1a1a; --border-light:rgba(255,255,255,0.06); }
        
        /* ===== FINAL GAP FIX - সব পেজের জন্য ===== */
        *{box-sizing:border-box}
        html, body{margin:0 !important; padding:0 !important; background:#0a0a0a !important; overflow-x:hidden;}

        #main-header{position:fixed !important; top:0 !important; left:0 !important; right:0 !important; height:56px !important; min-height:56px !important; margin:0 !important; background:#0a0a0a !important; z-index:40 !important; display:flex !important; align-items:center !important; justify-content:space-between !important; padding:0 16px !important;}

        /* সব পেজের উপরের ফাঁকা 56px ফিক্স */
        #home-page, #livetv-page, #cricket-page, #movies-page, #shorts-page, #grid-page-view, #player-page-view{
            padding-top:56px !important; margin-top:0 !important; margin-bottom:0 !important; padding-bottom:70px !important;
        }
        #search-overlay{padding-top:0 !important; margin-top:0 !important;}

        #banner-container{margin:0 !important; padding:0 !important; margin-bottom:8px !important;}
        #home-sections-container{margin:0 !important; padding:8px 16px 0 16px !important;}
        #livetv-category-bar, #cricket-page, #movies-page{margin-top:0 !important; padding-top:8px !important;}

        /* নিচের ৫ বাটন একদম নিচে লাগানো - কোনো গ্যাপ নেই */
        .bottom-nav{
            position:fixed !important; bottom:0 !important; left:0 !important; right:0 !important;
            width:100% !important; height:65px !important; margin:0 !important; padding:0 !important;
            padding-bottom:env(safe-area-inset-bottom) !important;
            background:#121212 !important; border-top:1px solid #222 !important;
            display:flex !important; justify-content:space-around !important; align-items:center !important;
            z-index:9999 !important;
        }
        .bottom-nav .nav-button.active{color:var(--primary-red) !important;}
        main.w-full{padding:0 !important; margin:0 !important; padding-bottom:65px !important;}
        footer, #ad-container{display:none !important;}

        /* Splash */
        #intro-splash{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999999;background:radial-gradient(ellipse at center,#1a1a2e 0%,#0a0a0a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s ease,transform 0.8s ease;}
        #intro-splash.hide{opacity:0;transform:scale(1.1);pointer-events:none;}
        .splash-logo{width:120px;height:120px;border-radius:30px;object-fit:cover;border:4px solid rgba(231,76,60,0.3);}
        .splash-title{font-size:42px;font-weight:900;margin-top:20px;color:#fff;}
        .splash-progress{margin-top:30px;width:200px;height:3px;background:rgba(255,255,255,0.06);border-radius:10px;overflow:hidden}
        .splash-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#e74c3c,#ff6b6b);border-radius:10px;transition:width 0.3s ease}
        .splash-version{position:absolute;bottom:40px;color:#555;font-size:12px;}
        #app-shell{display:none}#app-shell.visible{display:block}
        #shorts-page{padding:0 !important;margin:0 !important;padding-top:56px !important;height:100vh !important;}
        #shorts-page iframe{width:100%;height:calc(100vh - 56px);border:none;background:#000;display:block}
        .scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{scrollbar-width:none}
        .drawer-header-logo{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border-light);background:rgba(255,255,255,0.02)}
        .drawer-header-left{display:flex;align-items:center;gap:14px}.drawer-logo-img{height:48px;width:48px;border-radius:12px;object-fit:cover;border:2px solid var(--border-light)}.drawer-brand-logo{font-size:26px;font-weight:900;color:#fff}.drawer-tagline{font-size:12px;color:#ccc}
        .drawer-link{display:flex;align-items:center;padding:10px 12px;border-radius:10px;color:#ccc;gap:12px;text-decoration:none}.drawer-link i{width:24px;text-align:center;color:var(--primary-red)}
    </style>
</head>
<body>

    <div id="intro-splash">
        <img src="https://i.postimg.cc/mD1VCt2C/RS-Live.png" alt="Rs Live Tv" class="splash-logo">
        <h1 class="splash-title">Rs Live Tv</h1>
        <div class="splash-progress"><div class="splash-progress-bar" id="splashProgressBar"></div></div>
        <span class="splash-version">Version 4.1</span>
    </div>

    <div id="drawer-overlay" class="fixed inset-0 bg-black/60 z-[90] hidden"></div>
    <nav id="nav-drawer" class="fixed top-0 left-0 h-full w-72 max-w-[80vw] bg-gradient-to-b from-[#1a1a1a] to-[#0d0d0d] z-[91] flex flex-col transform -translate-x-full transition-transform duration-300">
        <div class="drawer-header-logo"><div class="drawer-header-left"><img src="https://i.postimg.cc/mD1VCt2C/RS-Live.png" class="drawer-logo-img"><div><h2 class="drawer-brand-logo">Rs Live Tv</h2><span class="drawer-tagline">✦ Unlimited Entertainment</span></div></div></div>
    </nav>

    <div id="app-shell">
        <header id="main-header">
            <div class="flex items-center gap-3">
                <button id="drawer-open-btn" class="text-xl text-gray-200"><i class="fas fa-bars"></i></button>
                <span class="text-white font-bold text-lg">Rs <span class="text-[#e74c3c]">Live</span></span>
            </div>
            <div class="flex items-center gap-5">
                <button id="search-open-btn" class="text-xl text-gray-200"><i class="fas fa-search"></i></button>
                <a href="account.html" class="w-8 h-8 rounded-full overflow-hidden border border-gray-500 bg-gray-800"><img src="https://img.icons8.com/bubbles/100/user.png" class="w-full h-full object-cover p-0.5"></a>
            </div>
        </header>

        <main class="w-full">
            <div id="home-page" class="page-content active">
                <section id="banner-container" class="relative w-full h-[60vw] max-h-[480px] min-h-[250px] bg-[#1a1a1a] overflow-hidden"></section>
                <div id="home-sections-container" class="space-y-4"></div>
            </div>
            <div id="livetv-page" class="page-content px-4"><div id="livetv-category-bar" class="flex overflow-x-auto gap-3 pb-3 mb-4 scrollbar-hide"></div><div id="livetv-grid-container" class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8 gap-4"></div></div>
            <div id="cricket-page" class="page-content px-4"></div>
            <div id="movies-page" class="page-content px-4"></div>
            <div id="shorts-page" class="page-content"><iframe src="shorts.html" id="shorts-iframe" allow="autoplay; fullscreen"></iframe></div>
        </main>
    </div>

    <nav class="bottom-nav">
        <button data-target="home-page" class="nav-button active"><i class="fas fa-house nav-icon"></i><span>HOME</span></button>
        <button data-target="cricket-page" class="nav-button"><i class="fas fa-trophy nav-icon"></i><span>EVENTS</span></button>
        <button data-target="shorts-page" class="nav-button"><i class="fas fa-bolt nav-icon"></i><span>SHORTS</span></button>
        <button data-target="livetv-page" class="nav-button"><i class="fas fa-tv nav-icon"></i><span>LIVE TV</span></button>
        <button data-target="movies-page" class="nav-button"><i class="fas fa-film nav-icon"></i><span>MOVIES</span></button>
    </nav>

    <div id="grid-page-view" class="fixed inset-0 bg-[#0a0a0a] z-[80] hidden overflow-y-auto"><header class="flex items-center p-4 bg-black/90 sticky top-0 z-10 border-b border-gray-800"><button id="grid-back-btn" class="text-xl mr-4"><i class="fas fa-arrow-left"></i></button><h2 id="grid-page-title" class="text-lg font-bold truncate"></h2></header><main id="grid-page-content" class="p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></main></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script type="module" src="main.js"></script>
    <script>
    (function(){
        const splash=document.getElementById('intro-splash'); const appShell=document.getElementById('app-shell'); const progressBar=document.getElementById('splashProgressBar');
        let progress=0; const interval=setInterval(function(){progress+=Math.random()*8+2; if(progress>100)progress=100; progressBar.style.width=progress+'%'; if(progress>=100){clearInterval(interval); setTimeout(function(){splash.classList.add('hide'); appShell.classList.add('visible'); setTimeout(()=>{splash.style.display='none'},800)},500)}},200);
        const drawerOpenBtn=document.getElementById('drawer-open-btn'); const drawerOverlay=document.getElementById('drawer-overlay'); const navDrawer=document.getElementById('nav-drawer');
        const openDrawer=()=>{navDrawer.classList.remove('-translate-x-full');drawerOverlay.classList.remove('hidden')}; const closeDrawer=()=>{navDrawer.classList.add('-translate-x-full');drawerOverlay.classList.add('hidden')};
        drawerOpenBtn.addEventListener('click',openDrawer); drawerOverlay.addEventListener('click',closeDrawer);
        document.querySelectorAll('.page-content').forEach(p=>p.style.display='none'); document.getElementById('home-page').style.display='block';
        document.querySelectorAll('.nav-button').forEach(btn=>{btn.addEventListener('click',function(){document.querySelectorAll('.nav-button').forEach(b=>b.classList.remove('active'));this.classList.add('active');const target=this.dataset.target;document.querySelectorAll('.page-content').forEach(p=>{if(p.id!=='shorts-page' || target!=='shorts-page') p.style.display='none'; else p.style.display='none'}); document.getElementById(target).style.display='block';})});
    })();
    </script>
</body>
</html>
